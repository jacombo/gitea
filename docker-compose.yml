services:
  gitea:
    image: gitea/gitea:1.22
    container_name: lab-gitea
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__actions__ENABLED=true
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    networks:
      - cicd_net
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: lab-runner
    environment:
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=arm64-local-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:host,self-hosted:host
    volumes:
      - runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Namapujeme modul-2 na úplně stejnou absolutní cestu jako na hostiteli
      - /home/ubuntu/nginx:/home/ubuntu/nginx
    depends_on:
      - gitea
    networks:
      - cicd_net
    restart: unless-stopped

volumes:
  gitea_data:
  runner_data:

networks:
  cicd_net:
    driver: bridge
